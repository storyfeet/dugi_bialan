	<button id="btn_next">Next</button>

<script type="module">
import {items} from "/js/items.js";
import {fontMap,letterMap} from "/js/jsfontmapper.js";
import * as DL from "/js/domlite.js";

import * as TD from "/js/type_dugi.js" ;

let converter = new TD.Converter(fontMap,letterMap);


function title(s){
    return DL.tag("h2",{},[s]);
}

function dugi_text(tx){
	let de_dash = tx.replace(/-/g,' ');
	let dugi = converter.convert(de_dash);
	return DL.tag('div',{},[
		DL.span(dugi,{className: "eg_logo"}),
		DL.br(),
		DL.tx(tx),
		
	]);
}

function example(ex_ob){
	return DL.tr({},[
		DL.td({className:"eg_dugi"},dugi_text(ex_ob.dugi)),
		DL.td({className:"eg_en"},DL.tx(ex_ob.en))
	]);
}

function examples(ex_ar){
	if (!ex_ar) return null;
	return DL.tag("table",{className:"eg_table"},ex_ar.map(example));
}

function question_text(tx, mode){
	if (mode === "dugi"){
		return dugi_text(tx);
	}
	return DL.tx(tx);
}

function question(question,reveal){
	if (!question) return null;

	let from = question[question.from ?? "dugi"];
	let to = question[question.to ?? "en"];

	return DL.tag("div",{},[
		DL.tag("h3",{},["Your turn"]),
		DL.tag("table", {className:"q_table"},[
			DL.tag("tr",{},[
				DL.tag("td",{},[
					DL.tag("button",{onclick:reveal_answer},[
						"Reveal"
					])
				]),
				DL.tag("td",{},[

					question_text(from,question.from ?? "dugi"),
					reveal && question_text(to,question.to),
				])

			])

		])
		
	]);

}

function page(question_data,reveal){
	return DL.tag("div",{},[
		DL.tag("h3",{},[question_data.title]),
		examples(question_data.examples),
		question(question_data.quiz,reveal),
	])
}


let dom = {
    quiz_area : document.getElementById("quiz_area"),
	btn_reveal : document.getElementById("btn_reveal"),
	btn_next : document.getElementById("btn_next"),
	btn_prev : document.getElementById("btn_prev"),
};

btn_next.onclick = ()=>{
	next_question();
};

function reveal_answer() {
	state.reveal = !state.reveal;
	draw_page();
}
btn_prev.onclick = () => {
	set_question(state.question_num -1);
}

let state = {
	question_num : 0,
	questions:[],
};

	dom.quiz_area.innerHTML = "";
	dom.quiz_area.append(title("Loading ..."));


	async function load_questions(){
		let data = await fetch("/json/fun_friday.json");
		let quiz = await data.json();
		state.questions = quiz;
		set_question(0);

	}
	
	function draw_page(){
		dom.quiz_area.innerHTML = "";
		dom.quiz_area.append(page(state.questions[state.question_num],state.reveal));
	}

	function set_question(n){

		state.question_num = n;
		state.reveal = false;
		draw_page();
		
	}

	function next_question(){
		set_question(state.question_num + 1);
	}

	load_questions();

</script>
        </div>
    </div>

<script type="module">

function setWideMode(){
    let body = document.getElementById('doc_body');
    if (window.innerHeight > window.innerWidth){
        body.classList.add('tall_window');
        body.classList.remove('wide_window');
    } else{
        body.classList.add('wide_window');
        body.classList.remove('tall_window');
    }
}
window.onresize = setWideMode;

function showHideMenu_(){
    let lastY = 0;
    return ()=>{
        let menu = document.getElementById('top_menu');
        if (window.scrollY < 200){
            console.log('Menu - inline');
            menu.classList.remove("fix","hide");
        }else if (window.scrollY > lastY){
            console.log('menu - hide');
            menu.classList.remove("fix");
            menu.classList.add("hide");
        } else{
            console.log('menu - fix');
            menu.classList.add("fix");
            menu.classList.remove("hide");
        }
        console.log("last,current",lastY,window.scrollY );

        lastY = window.scrollY;
    }
}

</script>
